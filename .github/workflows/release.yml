name: Build and publish release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultimate-wine-toolbox-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain a stable semantic version (X.Y.Z), got: $VERSION" >&2
            exit 1
          fi
          test -s "release-notes/v$VERSION.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install image tooling
        run: python3 -m pip install --disable-pip-version-check Pillow

      - name: Validate package sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print)
          python3 -m unittest discover -s tests -v

      - name: Build release assets
        id: package
        env:
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="Ultimate-Wine-Toolbox-$TAG"
          mkdir -p "dist/$ROOT"
          cp VERSION package-install.sh uninstall.sh README.md README.fr.md "dist/$ROOT/"
          cp -a release-notes "dist/$ROOT/release-notes"
          cp -a toolbox "dist/$ROOT/toolbox"
          python3 .github/scripts/prepare-scraper-assets.py "dist/$ROOT/toolbox/scraper-assets"
          find "dist/$ROOT" -type d -name __pycache__ -prune -exec rm -rf {} +
          (
            cd dist
            zip -qr "$ROOT.zip" "$ROOT"
            sha256sum "$ROOT.zip" > "$ROOT.zip.sha256"
          )
          echo "asset=dist/$ROOT.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$ROOT.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading/replacing release assets."
            gh release upload "$TAG" "$ASSET" "$CHECKSUM" --clobber
            gh release edit "$TAG" --title "Ultimate Wine Toolbox $TAG" --notes-file "release-notes/$TAG.md" --latest
          else
            gh release create "$TAG" "$ASSET" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Ultimate Wine Toolbox $TAG" \
              --notes-file "release-notes/$TAG.md" \
              --latest
          fi
