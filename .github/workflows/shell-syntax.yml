name: Source and regression checks

on:
  push:
    branches: [test, main]
    paths: ['**.sh', '**.py', 'VERSION', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y squashfs-tools python3-pil
      - run: python3 -m unittest discover -s tests -v
