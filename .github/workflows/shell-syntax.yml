name: Shell syntax check

on:
  push:
    branches:
      - test
    paths:
      - 'toolbox/modules/wsquashfs.sh'
      - 'toolbox/lib/common.sh'
      - 'toolbox/lib/download.sh'
      - 'toolbox/lang/fr.sh'
      - 'toolbox/lang/en.sh'
      - '.github/workflows/shell-syntax.yml'
  pull_request:
    paths:
      - 'toolbox/modules/wsquashfs.sh'
      - 'toolbox/lib/common.sh'
      - 'toolbox/lib/download.sh'
      - 'toolbox/lang/fr.sh'
      - 'toolbox/lang/en.sh'
      - '.github/workflows/shell-syntax.yml'
  workflow_dispatch:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n toolbox/modules/wsquashfs.sh
          bash -n toolbox/lib/common.sh
          bash -n toolbox/lib/download.sh
          bash -n toolbox/lang/fr.sh
          bash -n toolbox/lang/en.sh
