name: Shell syntax check

on:
  push:
    branches:
      - test
    paths:
      - 'toolbox/**/*.sh'
      - '.github/workflows/shell-syntax.yml'
  pull_request:
    paths:
      - 'toolbox/**/*.sh'
      - '.github/workflows/shell-syntax.yml'
  workflow_dispatch:

jobs:
  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            bash -n "$file"
          done < <(find toolbox -type f -name '*.sh' -print0)
